<svg viewBox="0 0 1160 660" xmlns="http://www.w3.org/2000/svg">

<defs>
  <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#475569"/>
  </marker>
  <marker id="arr-navy" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#1F497D"/>
  </marker>
  <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#c81e1e"/>
  </marker>
  <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#059669"/>
  </marker>
  <marker id="hollow-tri" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
    <polygon points="0 0, 10 4, 0 8" fill="#ffffff" stroke="#1F497D" stroke-width="1.2"/>
  </marker>
</defs>

<rect width="100%" height="100%" fill="#f8fafc"/>
<rect x="20" y="20" width="725" height="620" rx="9" fill="rgba(31,73,125,0.03)" stroke="#94a3b8" stroke-width="1.1" stroke-dasharray="6,4"/>
<text x="34" y="38" fill="#475569" font-size="9.5" font-weight="700" font-family="Consolas, monospace" letter-spacing="0.06em">MODELO HÍBRIDO IMPLEMENTADO EN PoC (SQLITE 3 dev.db + PRISMA ORM · 4 TABLAS 3FN EN ESPAÑOL)</text>
<rect x="40" y="55" width="290" height="146" rx="5" fill="#ffffff" stroke="#1F497D" stroke-width="1.5"/>
<rect x="40" y="55" width="290" height="24" rx="4" fill="#1F497D"/>
<text x="185.0" y="71" fill="#ffffff" font-size="10.5" font-weight="700" font-family="Consolas, monospace" text-anchor="middle">usuarios</text>
<text x="50" y="95" fill="#c81e1e" font-size="8.8" font-family="Consolas, monospace">PK id: TEXT (UUID)</text>
<text x="50" y="109" fill="#334155" font-size="8.8" font-family="Consolas, monospace">   correo: TEXT (UNIQUE)</text>
<text x="50" y="123" fill="#334155" font-size="8.8" font-family="Consolas, monospace">   clave_hash: TEXT (bcrypt 12)</text>
<text x="50" y="137" fill="#334155" font-size="8.8" font-family="Consolas, monospace">   nombre: TEXT</text>
<text x="50" y="151" fill="#334155" font-size="8.8" font-family="Consolas, monospace">   rol: TEXT (&#x27;ADMIN&#x27;)</text>
<text x="50" y="165" fill="#334155" font-size="8.8" font-family="Consolas, monospace">   intentos_fallidos: INTEGER (0..5)</text>
<text x="50" y="179" fill="#334155" font-size="8.8" font-family="Consolas, monospace">   bloqueado_hasta: DATETIME?</text>
<text x="50" y="193" fill="#334155" font-size="8.8" font-family="Consolas, monospace">   fecha_creacion / actualizacion</text>
<rect x="40" y="275" width="290" height="146" rx="5" fill="#ffffff" stroke="#1F497D" stroke-width="1.5"/>
<rect x="40" y="275" width="290" height="24" rx="4" fill="#1F497D"/>
<text x="185.0" y="291" fill="#ffffff" font-size="10.5" font-weight="700" font-family="Consolas, monospace" text-anchor="middle">recintos</text>
<text x="50" y="315" fill="#c81e1e" font-size="8.8" font-family="Consolas, monospace">PK id: TEXT (UUID)</text>
<text x="50" y="329" fill="#1F497D" font-size="8.8" font-family="Consolas, monospace">FK usuario_id -&gt; usuarios.id (CASCADE)</text>
<text x="50" y="343" fill="#334155" font-size="8.8" font-family="Consolas, monospace">   nombre: TEXT</text>
<text x="50" y="357" fill="#334155" font-size="8.8" font-family="Consolas, monospace">   ancho_metros / largo_metros: REAL</text>
<text x="50" y="371" fill="#334155" font-size="8.8" font-family="Consolas, monospace">   alto_metros: REAL</text>
<text x="50" y="385" fill="#334155" font-size="8.8" font-family="Consolas, monospace">   tipo_entorno: TEXT</text>
<text x="50" y="399" fill="#334155" font-size="8.8" font-family="Consolas, monospace">   distancia_electrica_metros: REAL</text>
<text x="50" y="413" fill="#334155" font-size="8.8" font-family="Consolas, monospace">   fecha_creacion / actualizacion</text>
<rect x="385" y="55" width="335" height="160" rx="5" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
<rect x="385" y="55" width="335" height="24" rx="4" fill="#059669"/>
<text x="552.5" y="71" fill="#ffffff" font-size="10.5" font-weight="700" font-family="Consolas, monospace" text-anchor="middle">calculos_rider (NÚCLEO HÍBRIDO)</text>
<text x="395" y="95" fill="#c81e1e" font-size="8.8" font-family="Consolas, monospace">PK id: TEXT (UUID)</text>
<text x="395" y="109" fill="#1F497D" font-size="8.8" font-family="Consolas, monospace">FK usuario_id -&gt; usuarios.id (CASCADE)</text>
<text x="395" y="123" fill="#1F497D" font-size="8.8" font-family="Consolas, monospace">FK recinto_id -&gt; recintos.id (CASCADE)</text>
<text x="395" y="137" fill="#334155" font-size="8.8" font-family="Consolas, monospace">   version_motor: TEXT (&#x27;4.0.0&#x27;)</text>
<text x="395" y="151" fill="#059669" font-size="8.8" font-family="Consolas, monospace">   entrada_rider: JSON (Tops/Subs/Power)</text>
<text x="395" y="165" fill="#059669" font-size="8.8" font-family="Consolas, monospace">   parametros_usados: JSON (RIC 03/10)</text>
<text x="395" y="179" fill="#059669" font-size="8.8" font-family="Consolas, monospace">   resultados_calculados: JSON (Watts/SPL)</text>
<text x="395" y="193" fill="#059669" font-size="8.8" font-family="Consolas, monospace">   alertas_snapshot: JSON (SEC/Speakon)</text>
<text x="395" y="207" fill="#334155" font-size="8.8" font-family="Consolas, monospace">   fecha_creacion: DATETIME</text>
<rect x="385" y="295" width="335" height="132" rx="5" fill="#ffffff" stroke="#1F497D" stroke-width="1.5"/>
<rect x="385" y="295" width="335" height="24" rx="4" fill="#1F497D"/>
<text x="552.5" y="311" fill="#ffffff" font-size="10.5" font-weight="700" font-family="Consolas, monospace" text-anchor="middle">enlaces_compartidos</text>
<text x="395" y="335" fill="#c81e1e" font-size="8.8" font-family="Consolas, monospace">PK id: TEXT (UUID)</text>
<text x="395" y="349" fill="#1F497D" font-size="8.8" font-family="Consolas, monospace">FK usuario_id -&gt; usuarios.id (CASCADE)</text>
<text x="395" y="363" fill="#1F497D" font-size="8.8" font-family="Consolas, monospace">FK calculo_rider_id -&gt; calculos_rider.id</text>
<text x="395" y="377" fill="#334155" font-size="8.8" font-family="Consolas, monospace">   token: TEXT (UNIQUE)</text>
<text x="395" y="391" fill="#334155" font-size="8.8" font-family="Consolas, monospace">   fecha_expiracion: DATETIME</text>
<text x="395" y="405" fill="#334155" font-size="8.8" font-family="Consolas, monospace">   esta_revocado: INTEGER (0/1)</text>
<text x="395" y="419" fill="#334155" font-size="8.8" font-family="Consolas, monospace">   fecha_creacion: DATETIME</text>
<rect x="40" y="480" width="680" height="135" rx="7" fill="#ffffff" stroke="#1F497D" stroke-width="1.4" />
<rect x="50" y="488" width="131.0" height="15" rx="3" fill="#1F497D" fill-opacity="0.12" stroke="#1F497D" stroke-width="0.8"/>
<text x="115.5" y="498.5" fill="#1F497D" font-size="8.5" font-weight="700" font-family="Consolas, monospace" text-anchor="middle">SQL + JSON_EXTRACT</text>
<text x="380.0" y="518" fill="#1e293b" font-size="12" font-weight="700" font-family="Segoe UI, system-ui, sans-serif" text-anchor="middle">Consulta Híbrida Auditable en DB Browser for SQLite (3FN + json_extract)</text>
<text x="380.0" y="534" fill="#475569" font-size="9.5" font-family="Consolas, monospace" text-anchor="middle">SELECT u.nombre, r.nombre, json_extract(c.resultados_calculados, &#x27;$.totalWatts&#x27;) AS watts,</text>
<text x="380.0" y="548" fill="#475569" font-size="9.5" font-family="Consolas, monospace" text-anchor="middle">       json_extract(c.resultados_calculados, &#x27;$.electricalSummary.recommendedSectionMm2&#x27;) AS mm2</text>
<text x="380.0" y="562" fill="#475569" font-size="9.5" font-family="Consolas, monospace" text-anchor="middle">FROM usuarios u JOIN recintos r ON u.id = r.usuario_id</text>
<text x="380.0" y="576" fill="#475569" font-size="9.5" font-family="Consolas, monospace" text-anchor="middle">JOIN calculos_rider c ON r.id = c.recinto_id</text>
<text x="380.0" y="590" fill="#475569" font-size="9.5" font-family="Consolas, monospace" text-anchor="middle">WHERE json_extract(c.resultados_calculados, &#x27;$.electricalSummary.secCompliant&#x27;) = 1;</text>
<rect x="770" y="20" width="370" height="620" rx="9" fill="rgba(31,73,125,0.05)" stroke="#1F497D" stroke-width="1.1" stroke-dasharray="6,4"/>
<text x="784" y="38" fill="#475569" font-size="9.5" font-weight="700" font-family="Consolas, monospace" letter-spacing="0.06em">PROYECCIÓN PRODUCCIÓN U3 (POSTGRESQL 16)</text>
<rect x="790" y="60" width="330" height="135" rx="7" fill="#eff6ff" stroke="#1F497D" stroke-width="1.4" stroke-dasharray="5,4"/>
<rect x="800" y="68" width="92.0" height="15" rx="3" fill="#1F497D" fill-opacity="0.12" stroke="#1F497D" stroke-width="0.8"/>
<text x="846.0" y="78.5" fill="#1F497D" font-size="8.5" font-weight="700" font-family="Consolas, monospace" text-anchor="middle">DDL U3 LISTO</text>
<text x="955.0" y="98" fill="#1e293b" font-size="12" font-weight="700" font-family="Segoe UI, system-ui, sans-serif" text-anchor="middle">Esquema Extendido (12 Tablas)</text>
<text x="955.0" y="114" fill="#475569" font-size="9.5" font-family="Consolas, monospace" text-anchor="middle">Definido en sql/schema_stageplan_pg16.sql</text>
<text x="955.0" y="128" fill="#475569" font-size="9.5" font-family="Consolas, monospace" text-anchor="middle">• roles (RBAC 3 perfiles)</text>
<text x="955.0" y="142" fill="#475569" font-size="9.5" font-family="Consolas, monospace" text-anchor="middle">• equipment_catalog (JSONB + GIN)</text>
<text x="955.0" y="156" fill="#475569" font-size="9.5" font-family="Consolas, monospace" text-anchor="middle">• equipment_lots / lighting_fixtures</text>
<text x="955.0" y="170" fill="#475569" font-size="9.5" font-family="Consolas, monospace" text-anchor="middle">• electrical_circuits / audio_routes</text>
<rect x="790" y="225" width="330" height="145" rx="7" fill="#ffffff" stroke="#c81e1e" stroke-width="1.4" stroke-dasharray="5,4"/>
<rect x="800" y="233" width="92.0" height="15" rx="3" fill="#c81e1e" fill-opacity="0.12" stroke="#c81e1e" stroke-width="0.8"/>
<text x="846.0" y="243.5" fill="#c81e1e" font-size="8.5" font-weight="700" font-family="Consolas, monospace" text-anchor="middle">SEGURIDAD U3</text>
<text x="955.0" y="263" fill="#1e293b" font-size="12" font-weight="700" font-family="Segoe UI, system-ui, sans-serif" text-anchor="middle">Trazabilidad &amp; Auditoría U3</text>
<text x="955.0" y="279" fill="#475569" font-size="9.5" font-family="Consolas, monospace" text-anchor="middle">• audit_logs (IDOR_BLOCKED, LOGIN_FAIL)</text>
<text x="955.0" y="293" fill="#475569" font-size="9.5" font-family="Consolas, monospace" text-anchor="middle">• user_feedback (iteraciones terreno)</text>
<text x="955.0" y="307" fill="#475569" font-size="9.5" font-family="Consolas, monospace" text-anchor="middle">• Índices GIN (jsonb_path_ops)</text>
<text x="955.0" y="321" fill="#475569" font-size="9.5" font-family="Consolas, monospace" text-anchor="middle">• Triggers PL/pgSQL CHECK ΔV &lt;= 3%</text>
<text x="955.0" y="335" fill="#475569" font-size="9.5" font-family="Consolas, monospace" text-anchor="middle">• Extensión pgcrypto AES-256</text>
<rect x="790" y="400" width="330" height="135" rx="7" fill="#ecfdf5" stroke="#059669" stroke-width="1.4" />
<rect x="800" y="408" width="72.5" height="15" rx="3" fill="#059669" fill-opacity="0.12" stroke="#059669" stroke-width="0.8"/>
<text x="836.25" y="418.5" fill="#059669" font-size="8.5" font-weight="700" font-family="Consolas, monospace" text-anchor="middle">MIGRACIÓN</text>
<text x="955.0" y="438" fill="#1e293b" font-size="12" font-weight="700" font-family="Segoe UI, system-ui, sans-serif" text-anchor="middle">Ruta de Migración Prisma ORM</text>
<text x="955.0" y="454" fill="#475569" font-size="9.5" font-family="Consolas, monospace" text-anchor="middle">1. Cambiar provider = &#x27;postgresql&#x27;</text>
<text x="955.0" y="468" fill="#475569" font-size="9.5" font-family="Consolas, monospace" text-anchor="middle">2. Configurar DATABASE_URL en .env</text>
<text x="955.0" y="482" fill="#475569" font-size="9.5" font-family="Consolas, monospace" text-anchor="middle">3. npx prisma migrate deploy</text>
<text x="955.0" y="496" fill="#475569" font-size="9.5" font-family="Consolas, monospace" text-anchor="middle">Cero cambios en controladores REST</text>
